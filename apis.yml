name: chatail
description: Chatail is a Shanghai-based SaaS company (founded 2016) that provides private-domain
  livestream and video sales software for high-end and luxury retail brands across fashion, jewelry,
  beauty, automotive, and home-goods verticals, pairing intelligent customer acquisition with
  conversion tooling ("智能获客与高效转化双轮驱动"). The product is delivered as a hosted web application at
  chatail.com; no public developer API, documentation portal, or OpenAPI surface is published at this
  time (api.chatail.com serves a default nginx placeholder). Chatail raised a Series B round led by
  Qiming Venture Partners and is tracked in the API Evangelist network as a Qiming portfolio company.
